name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/aeo_corner_test
      SHADOW_DATABASE_URL: mysql://root:root@127.0.0.1:3306/aeo_corner_shadow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No Docker on this project (see CLAUDE.md). ubuntu-latest ships MySQL 8
      # pre-installed but disabled; start it and mirror DigitalOcean's
      # sql_require_primary_key rule before touching the schema.
      - name: Start MySQL and apply DigitalOcean's primary-key rule
        run: |
          sudo systemctl start mysql.service
          until mysqladmin ping -h127.0.0.1 -uroot -proot --silent; do sleep 1; done
          mysql -h127.0.0.1 -uroot -proot -e "SET GLOBAL sql_require_primary_key = ON;"
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE aeo_corner_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE aeo_corner_shadow CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: checks.sql must return zero rows
        run: |
          OUTPUT=$(mysql -h127.0.0.1 -uroot -proot aeo_corner_test < docs/db/checks.sql)
          if [ -n "$OUTPUT" ]; then
            echo "checks.sql returned rows:"
            echo "$OUTPUT"
            exit 1
          fi

      - name: Prisma migration drift check
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      - name: Unit tests
        run: npm test

      - name: Smoke test
        run: npm run test:smoke

      - name: Route tests
        run: npm run test:routes

      - name: Integration tests
        run: npm run test:integration

      - name: Cross-tenant leak tests
        run: npm run test:tenancy

      - name: Adapter/contract tests
        run: npm run test:adapters

      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
