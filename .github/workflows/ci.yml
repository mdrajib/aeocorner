name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/aeo_corner_test
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/aeo_corner_test
      SHADOW_DATABASE_URL: mysql://root:root@127.0.0.1:3306/aeo_corner_shadow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No Docker on this project (see CLAUDE.md). ubuntu-latest ships MySQL 8
      # pre-installed but disabled; start it and mirror DigitalOcean's
      # sql_require_primary_key rule before touching the schema.
      - name: Start MySQL and apply DigitalOcean's primary-key rule
        run: |
          sudo systemctl start mysql.service
          until mysqladmin ping -h127.0.0.1 -uroot -proot --silent; do sleep 1; done
          mysql -h127.0.0.1 -uroot -proot -e "SET GLOBAL sql_require_primary_key = ON;"
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE aeo_corner_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE aeo_corner_shadow CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"

      - name: Build CSS (Tailwind)
        run: npm run build:css

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: checks.sql must return zero rows
        run: |
          OUTPUT=$(mysql -h127.0.0.1 -uroot -proot aeo_corner_test < docs/db/checks.sql)
          if [ -n "$OUTPUT" ]; then
            echo "checks.sql returned rows:"
            echo "$OUTPUT"
            exit 1
          fi

      - name: Prisma migration drift check
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      - name: Unit tests
        run: npm test

      - name: Smoke test
        run: npm run test:smoke

      - name: Route tests
        run: npm run test:routes

      - name: Integration tests
        run: npm run test:integration

      - name: Cross-tenant leak tests
        run: npm run test:tenancy

      - name: Adapter/contract tests
        run: npm run test:adapters

      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  # Which parts of the repo changed? Used to run the (slower) browser job only when the UI could be affected.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ui:
              - 'src/web/**'
              - 'src/db/**'
              - 'src/core/**'
              - 'src/lib/**'
              - 'prisma/**'
              - 'tailwind/**'
              - 'tests/e2e/**'
              - 'playwright.config.js'
              - 'package-lock.json'

  # Accessibility (axe-core, WCAG 2.1 AA), responsive (375/768/1280 px), third-party-request and
  # styleguide checks in a real browser. Required to merge, but only runs when the UI changed
  # (BUILD_PLAN §2). The signed-in pages need the database, so it starts MySQL like the test job does.
  accessibility:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/aeo_corner_test
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/aeo_corner_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start MySQL and apply DigitalOcean's primary-key rule
        run: |
          sudo systemctl start mysql.service
          until mysqladmin ping -h127.0.0.1 -uroot -proot --silent; do sleep 1; done
          mysql -h127.0.0.1 -uroot -proot -e "SET GLOBAL sql_require_primary_key = ON;"
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE aeo_corner_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"

      - name: Apply migrations and generate the Prisma client
        run: |
          npx prisma migrate deploy
          npx prisma generate

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # playwright.config.js builds the CSS and starts tests/e2e/server.js (the app with a fake Clerk).
      - name: Playwright (a11y, responsive, third-party, styleguide, signed-in flows)
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
