# Nginx in front of the web process (docs/RUNBOOK_PROVISIONING.md §7). Cloudflare sits in front of Nginx and
# terminates the public TLS; Nginx listens for Cloudflare on 443 with an Origin CA certificate ("Full (strict)").
#
# Copy to /etc/nginx/sites-available/aeocorner.conf, change `server_name` and the certificate paths, and link it
# into sites-enabled. Staging uses the same file with its own name.

upstream aeo_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Anything that is not our name (a bot scanning the Droplet's address) gets nothing.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_certificate     /etc/ssl/aeocorner/origin.pem;
    ssl_certificate_key /etc/ssl/aeocorner/origin.key;
    return 444;
}

server {
    listen 443 ssl;
    http2 on;
    server_name aeocorner.com www.aeocorner.com admin.aeocorner.com;

    ssl_certificate     /etc/ssl/aeocorner/origin.pem;
    ssl_certificate_key /etc/ssl/aeocorner/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Express reads the visitor's address from the one proxy hop in front of it (TRUST_PROXY=1), so Nginx must
    # put the real address there. Behind Cloudflare that is the address Cloudflare reports, not the connection's.
    # Allow only Cloudflare's ranges to set it (https://www.cloudflare.com/ips/), by firewall: see the runbook.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0; # tightened by the Cloud Firewall: only Cloudflare reaches port 443

    client_max_body_size 1m;       # forms are 10 kB; Clerk's and Stripe's webhooks are small
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://aeo_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # The audit's live page streams server-sent events. Nginx must not buffer them or close them at 60 s: the
    # stream lasts up to 12 minutes and sends a message at least every few seconds.
    location ~ ^/audit/[0-9A-Z]{26}/events$ {
        proxy_pass http://aeo_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15m;
        add_header X-Accel-Buffering no;
    }

    # Fingerprinted assets (?v=<mtime>) are safe to cache for a long time; Express already sets the header.
    location ~* \.(?:css|js|woff2|svg|png|ico)$ {
        proxy_pass http://aeo_web;
        proxy_set_header Host $host;
        expires 7d;
    }
}
